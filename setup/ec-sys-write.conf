# tanmay.msi-power — load ec_sys with write support so the privileged
# fan-curve script (MControlCenter's raw-EC writes, narrowed to the 26 curve
# bytes) works for root. The debugfs io file itself stays 0640 via
# msi-ec-tmpfiles.conf: group members can READ the tach/curves, only root
# (via the sudoers-scoped curve script) can WRITE curves.
options ec_sys write_support=1
