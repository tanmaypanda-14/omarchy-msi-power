# tanmay.msi-power — boot-time permissions for the raw EC interface.
#
# debugfs has no udev events, so this is applied by
# msi-power-perms.service (ordered after debugfs is mounted and after
# modules-load) and by the ec_sys modprobe hook after any module reload.
#
# The group gets READ-ONLY access (0640, no write bit): enough to read the
# fan tachometer, deliberately not enough to poke other EC registers.
# 0710 on the directories lets the group traverse to the image without being
# able to list debugfs.
m /sys/kernel/debug 0710 root msi-ec -
m /sys/kernel/debug/ec 0710 root msi-ec -
m /sys/kernel/debug/ec/ec0 0710 root msi-ec -
m /sys/kernel/debug/ec/ec0/io 0640 root msi-ec -
