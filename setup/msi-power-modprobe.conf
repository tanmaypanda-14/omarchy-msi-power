# tanmay.msi-power — load ec_sys read-only.
#
# ec_sys exposes the raw EC image in debugfs. This widget (like msi-center)
# only reads the fan tachometer at 0xCC/0xCD; nothing writes raw EC registers,
# so write support stays off. The debugfs image is 0640 via
# msi-power-tmpfiles.conf: group-readable, never group-writable.
options ec_sys write_support=0

# debugfs recreates ec0/io with 0400 root:root on every module load, which
# discards any earlier grant. Re-apply it immediately after each load (boot,
# manual modprobe -r + modprobe, DKMS rebuild). --ignore-install prevents
# recursion into this hook.
install ec_sys /usr/bin/modprobe --ignore-install ec_sys $CMDLINE_OPTS && { /usr/bin/systemd-tmpfiles --create /etc/tmpfiles.d/msi-power.conf || true; }
