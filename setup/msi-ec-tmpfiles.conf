# tanmay.msi-power — boot-time permissions for the raw EC interface.
# ec_sys lives under debugfs, which udev never sees, so a rule cannot reach
# it (the msi-ec udev rule RUNs `systemd-tmpfiles --create` against this file
# at the exact moment the platform device appears, fixing the boot ordering).
#
# The group gets READ-ONLY access (mode 640, no write bit): enough to read
# the fan tachometer, and deliberately not enough to poke other EC registers.
m /sys/kernel/debug 0750 root msi-ec -
m /sys/kernel/debug/ec 0750 root msi-ec -
m /sys/kernel/debug/ec/ec0 0750 root msi-ec -
m /sys/kernel/debug/ec/ec0/io 0640 root msi-ec -