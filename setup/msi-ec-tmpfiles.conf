# tanmay.msi-power — make the raw EC register file (ec_sys debugfs) usable by
# the msi-ec group for the USB power-share toggle. udev never sees debugfs, so
# this re-applies ownership/mode at boot. 'm' only adjusts existing files;
# the parent dir also needs group traversal for the group members to reach it.
m /sys/kernel/debug/ec 0750 root msi-ec -
m /sys/kernel/debug/ec/ec0/io 0664 root msi-ec -